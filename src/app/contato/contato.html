<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato da Ilha</title>
  
  <!-- Biblioteca Font Awesome para os ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- Barra de Pesquisa -->
  <form onsubmit="event.preventDefault();">
    <input type="text" id="inputBusca" placeholder="Pesquisar..." oninput="filtrarNomes()">
    <button type="submit">
      <i class="fa-solid fa-magnifying-glass"></i>
    </button>
  </form>

  <br>

  <footer>
    <hr>
    <h3>Contato da Ilha</h3>

    <!-- Onde os nomes serão inseridos pelo JS -->
    <div id="lista-membros"></div>
  </footer>

  <script>

    const membros = [

        github: "https://github.com/Kethynoliveira1-dev"
      },
      {

      },
      {

        linkedin: "https://www.linkedin.com/in/livia-mendonca-779604368",
        github: "https://github.com/Livia126"
      },
    ];

    // Função para renderizar os cards dos membros na tela
    function renderizarMembros(lista) {
      const contêiner = document.getElementById('lista-membros');
      contêiner.innerHTML = ''; // Limpa o conteúdo antes de desenhar

      // Exibe a mensagem caso a busca retorne uma lista vazia
      if (lista.length === 0) {
        contêiner.innerHTML = '<p>Nenhuma integrante encontrada.</p>';
        return;
      }

      lista.forEach(membro => {
        const linkEmail = membro.email ? `https://mail.google.com/mail/?view=cm&fs=1&to=${membro.email}` : '#';
        
        const htmlMembro = `
          <div class="membro">
            <p><strong>${membro.nome}</strong></p>
            <a href="${linkEmail}" target="_blank"><i class="fa-regular fa-envelope"></i> E-mail</a> |
            <a href="${membro.linkedin}" target="_blank"><i class="fa-brands fa-linkedin"></i> LinkedIn</a> | 
            <a href="${membro.github}" target="_blank"><i class="fa-brands fa-github"></i> GitHub</a>
            <br><br>
          </div>
        `;
        contêiner.innerHTML += htmlMembro;
      });
    }

    // Função para filtrar a lista com base no que foi digitado
    function filtrarNomes() {
      const input = document.getElementById('inputBusca').value;
      
      const termoBusca = input
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();

      // Filtra o array original mantendo apenas quem combina com a pesquisa
      const membrosFiltrados = membros.filter(membro => {
        const nomeTratado = membro.nome
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase();

        return nomeTratado.includes(termoBusca);
      });

      // Renderiza novamente apenas os membros filtrados
      renderizarMembros(membrosFiltrados);
    }

    // Carrega todos os membros assim que a página abre
    renderizarMembros(membros);
  </script>

</body>
</html>
