<header class="header">
  <a class="logo" routerLink="/">
    <img src="assets/icons/Logo Gamodan.svg" alt="" class="logo-icon" aria-hidden="true">
    <span>Gamodan</span>
  </a>
  <nav class="menu" aria-label="Navegação principal">
    <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">Início</a>
    @if (auth.autenticado()) {
      @if (auth.admin()) {
        <a routerLink="/catalogo" routerLinkActive="ativo">Catálogo</a>
      } @else {
        <a routerLink="/lista" routerLinkActive="ativo">Lista</a>
      }
      <a routerLink="/perfil" routerLinkActive="ativo">Perfil</a>
    }
    <a routerLink="/contato" routerLinkActive="ativo">Contato</a>
    @if (auth.autenticado()) {
      @if (auth.usuario()?.foto; as foto) { <img class="avatar-mini" [src]="foto" alt="Foto de perfil"> }
      <button type="button" class="menu-acao" (click)="sair()">Sair</button>
    } @else {
      <button type="button" class="menu-acao" (click)="abrirAutenticacao('entrar')">Entrar</button>
    }
  </nav>
</header>
